databaseChangeLog:
  - changeSet:
      id: 1
      author: kovalenkojuls
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: product_id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: price
                  type: decimal(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: quantity_in_stock
                  type: int
                  constraints:
                    nullable: false

  - changeSet:
      id: 2
      author: kovalenkojuls
      changes:
        - createTable:
            tableName: customer
            columns:
              - column:
                  name: customer_id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: contact_number
                  type: varchar(20)
                  constraints:
                    nullable: false

  - changeSet:
      id: 3
      author: kovalenkojuls
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: order_id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_customer
                    references: customer(customer_id)
              - column:
                  name: order_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: shipping_address
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: decimal(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: order_status
                  type: varchar(50)
                  constraints:
                    nullable: false

  - changeSet:
      id: 4
      author: kovalenkojuls
      changes:
        - createTable:
            tableName: order_product
            columns:
              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_product_order
                    references: orders(order_id)
              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_product_product
                    references: product(product_id)
            constraints:
              primaryKey:
                columnNames: order_id, product_id